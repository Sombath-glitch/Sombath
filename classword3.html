<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            background-color: pink;
        }
    </style>
</head>

<body>
    <center>
        <table>
            <tr>
                <td style="text-align: center;" colspan="2"><b>Student Registration From</b></td>
            </tr>
            <tr>
                <td>Roll no :</td>
                <td>
                    <input type="text" style="width: 50%;">
                </td>
            </tr>
            <tr>
                <td>Student name :</td>
                <td>
                    <input type="text" style="width: 23.5%;" placeholder="First Name"> -
                    <input type="text" style="width: 23.5%;" placeholder="Last Name">
                </td>
            </tr>
            <tr>
                <td>Father's name :</td>
                <td>
                    <input type="text" style="width: 50%;">
                </td>
            </tr>
            <tr>
                <td>Date Of birth :</td>
                <td>
                    <input type="text" style="width: 5%;" placeholder="Day"> -
                    <input type="text" style="width: 5%;" placeholder="Month"> -
                    <input type="text" style="width: 5%;" placeholder="Year"> (DD-MM-YYYY)
                </td>
            </tr>
            <tr>
                <td>Mobile no :</td>
                <td>
                    <input type="text" style="width: 5%;" placeholder=""> -
                    <input type="text" style="width: 42%;">
                </td>
            </tr>
            <tr>
                <td>Email id :</td>
                <td>
                    <input type="text" style="width: 50%;">
                </td>
            </tr>
            <tr>
                <td>Password :</td>
                <td>
                    <input type="text" style="width: 50%;">
                </td>
            </tr>
            <tr>
                <td>Gender :</td>
                <td>
                    <input type="radio">
                    <label for="">Male</label>
                    <input type="radio">
                    <label for="">Female</label>
                </td>
            </tr>
            <tr>
                <td>Dempartment :</td>
                <td>
                    <input type="checkbox">
                    <label for="">CSE</label>
                    <input type="checkbox">
                    <label for="">IT</label>
                    <input type="checkbox">
                    <label for="">ECE</label>
                    <input type="checkbox">
                    <label for="">Civil</label>
                    <input type="checkbox">
                    <label for="">Mech</label>
                </td>
            </tr>
            <tr>
                <td>Course :</td>
                <td>
                    <select name="" id="">
                        <option value="Select Current Course's">------------ Select Current Course's ------------
                        </option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Student photo :</td>
                <td>
                    <input type="file">
                </td>
            </tr>
            <tr>
                <td>City :</td>
                <td>
                    <input type="text">
                </td>
            </tr>
            <tr>
                <td>Address :</td>
                <td>
                    <textarea name="" id=""></textarea>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <button style="margin-left: 45%;">Register</button>
                </td>
            </tr>

        </table>
    </center>
</body>

</html>
