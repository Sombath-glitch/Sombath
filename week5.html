<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <div class="container">
        <form action="">
            <h1>Facebook</h1>
            <img src="https://img.freepik.com/premium-vector/facebook-logo-vector-facebook-official-logo-vector-facebook-logo-illustrator_1002350-1803.jpg?semt=ais_hybrid&w=740&q=80" alt=""><br>
            <label for="">Email</label>
            <input type="text" placeholder="Enter Email"><br>
            <label for="">Password</label>
            <input type="password" placeholder="Enter Password">
            <div class="checkbox">
            <input type="checkbox">
            <label for="">Show Password</label>
            </div>
            <button>SIGN IN</button>
            <p>Forgot <a href="">Usename / Password</a></p>
            <p>Don't have an account? <a href="">Sign up</a></p>
        </form>
    </div>
</body>
</html>
